apply plugin: 'com.android.application'

// Version: same rule as app/scripts/app-version.mjs (100 + commit count). Overridable with
// -PversionCode=… -PversionName=… . Never change the rule once the app is installed somewhere.
def gitCommitCount = {
    try {
        return providers.exec { commandLine 'git', 'rev-list', '--count', 'HEAD' }.standardOutput.asText.get().trim().toInteger()
    } catch (ignored) {
        return 0
    }
}
def appVersionCode = project.hasProperty('versionCode') ? project.property('versionCode').toString().toInteger() : 100 + gitCommitCount()
def appVersionName = project.hasProperty('versionName') ? project.property('versionName').toString() : "1.0.${appVersionCode - 100}"

android {
    namespace = "ch.zumbusch.satzmodelle"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ch.zumbusch.satzmodelle"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // One stable key for every build (debug and release): Android installs an update only when the
    // signature matches, otherwise the app (and its data) must be removed first. The key never enters
    // the repository. CI: ANDROID_KEYSTORE_PATH + passwords from secrets. Locally: keystore.properties.
    def ks = null
    if (System.getenv('ANDROID_KEYSTORE_PATH')) {
        ks = [storeFile: System.getenv('ANDROID_KEYSTORE_PATH'), storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
              keyAlias: System.getenv('ANDROID_KEY_ALIAS'), keyPassword: System.getenv('ANDROID_KEY_PASSWORD')]
    } else if (rootProject.file('keystore.properties').exists()) {
        def p = new Properties()
        rootProject.file('keystore.properties').withInputStream { p.load(it) }
        ks = [storeFile: p['storeFile'], storePassword: p['storePassword'], keyAlias: p['keyAlias'], keyPassword: p['keyPassword']]
    }
    if (ks) {
        signingConfigs {
            stable {
                storeFile file(ks.storeFile)
                storePassword ks.storePassword
                keyAlias ks.keyAlias
                keyPassword ks.keyPassword
            }
        }
        buildTypes.debug.signingConfig signingConfigs.stable
        buildTypes.release.signingConfig signingConfigs.stable
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.media:media:1.7.1"
    implementation "com.google.android.gms:play-services-auth:21.4.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
